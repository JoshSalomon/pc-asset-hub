apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: exporterplugins.assethub.project-catalyst.io
spec:
  group: assethub.project-catalyst.io
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: ["endpoint"]
              properties:
                description:
                  type: string
                endpoint:
                  type: string
                timeoutSeconds:
                  type: integer
                  minimum: 3
                parameterSchema:
                  type: array
                  items:
                    type: object
                    required: ["name", "type"]
                    properties:
                      name:
                        type: string
                      type:
                        type: string
                      description:
                        type: string
                      required:
                        type: boolean
                      default:
                        type: string
                      attributeMappings:
                        type: array
                        items:
                          type: object
                          required: ["name"]
                          properties:
                            name:
                              type: string
                            description:
                              type: string
                            required:
                              type: boolean
                            default:
                              type: string
                trustedSubjects:
                  type: array
                  items:
                    type: string
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum: ["Ready", "Unhealthy", "Error", "Unknown"]
                lastHealthCheck:
                  type: string
                message:
                  type: string
      subresources:
        status: {}
  scope: Namespaced
  names:
    plural: exporterplugins
    singular: exporterplugin
    kind: ExporterPlugin
    shortNames:
      - ep
